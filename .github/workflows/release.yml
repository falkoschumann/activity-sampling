name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create release
        run: gh release create ${{ github.ref_name }} --verify-tag --generate-notes --draft
  upload-assets:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    env:
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GH_TOKEN: ${{ github.token }}
      MAC_SIGN: true
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
      - name: Build distribution file
        shell: bash
        run: make dist
      - name: Determine OS-specific distribution file
        shell: bash
        run: |
          case $RUNNER_OS in
            Linux) echo "DIST_FILE=./dist/*.deb" >> $GITHUB_ENV ;;
            macOS) echo "DIST_FILE=./dist/*.dmg" >> $GITHUB_ENV ;;
            Windows) echo "DIST_FILE=./dist/*.exe" >> $GITHUB_ENV ;;
          esac
      - name: Upload distribution file
        shell: bash
        run: |
          if [ -f "${DIST_FILE}" ]; then
            gh release upload ${{ github.ref_name }} ${{ env.DIST_FILE }}
          else
            echo "Distribution file not found: ${DIST_FILE}"
            exit 1
          fi
