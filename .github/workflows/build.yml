name: Build

on: push

permissions:
  contents: read

env:
  ESDM_VERSION: 0.15.0
  ESDM_SHA256: db76e45729e5318023120143356df461dbddfbedf2108111c0d8b7b595f42a84

jobs:
  build:
    env:
      TZ: "Europe/Berlin"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
      - name: Install esdm CLI
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/bin/esdm" \
            "https://esdm.s3.fr-par.scw.cloud/$ESDM_VERSION/esdm-linux-amd64"
          echo "$ESDM_SHA256  $RUNNER_TEMP/bin/esdm" | sha256sum --check
          chmod a+x "$RUNNER_TEMP/bin/esdm"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Cache Electron downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: electron-${{ runner.os }}-
      - name: Allow the Electron sandbox
        run: sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build
        run: xvfb-run --auto-servernum make
